<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Show Orchestrator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --panel: #fff; --border: #d9dce1; --text: #1c1f24; --muted: #667080;
    --accent: #2f6fed; --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --panel: #1e2126; --border: #33373f; --text: #e6e8ec; --muted: #98a1b0;
      --accent: #6c9bff; --error: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text);
  }
  form {
    width: min(320px, calc(100vw - 32px)); display: grid; gap: 12px; padding: 20px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  label { display: grid; gap: 4px; color: var(--muted); }
  input, button {
    font: inherit; color: inherit; padding: 6px 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg);
  }
  button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .error { color: var(--error); margin: 0; }
</style>
</head>
<body>
<form method="post" action="{{ url_for('login') }}">
  <h1>Show Orchestrator</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label>User <input name="user" value="{{ user }}" autocomplete="username" autocapitalize="none" required {% if not user %}autofocus{% endif %}></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required {% if user %}autofocus{% endif %}></label>
  {% if failed %}<p class="error">Wrong user or password.</p>{% endif %}
  <button>Log in</button>
</form>
</body>
</html>
